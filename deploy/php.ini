; Produktionseinstellungen für das Ticketsystem.

; Fehler gehören ins Log, nicht in die Antwort — eine Laravel-Fehlerseite
; verrät Pfade, Paketversionen und im Zweifel Teile der Konfiguration.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Anhänge an Tickets. Der Wert für post_max_size muss über dem für
; upload_max_filesize liegen, sonst schlägt der Upload ohne verständliche
; Meldung fehl.
upload_max_filesize = 16M
post_max_size = 20M

memory_limit = 256M
max_execution_time = 60

; OPcache: der Code ändert sich nur beim Deploy, also muss PHP die Dateien
; nicht bei jeder Anfrage auf Änderungen prüfen. Beim Deploy entsteht ohnehin
; ein neuer Container mit leerem Cache.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

expose_php = Off
date.timezone = Europe/Berlin
